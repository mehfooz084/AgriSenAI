<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mandi Prices — AgriSense AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,650&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="mandi" class="min-h-screen bg-gradient-to-br from-[#dcfce7] via-[#f6f7f4] to-[#c7d2fe] text-emerald-950">
  <div class="fixed inset-0 z-[-1] bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-emerald-200/40 via-transparent to-transparent"></div>
  <header class="sticky top-0 z-40 border-b border-emerald-100/50 bg-white/60 backdrop-blur-xl shadow-sm">
    <div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-3 px-4 py-3">
      <a href="index.html" class="text-sm font-semibold tracking-tight text-emerald-900">🌱 AgriSense AI</a>
      <button id="nav-toggle" class="rounded-lg border border-stone-200 px-3 py-2 text-sm md:hidden" aria-expanded="false" aria-controls="nav-menu">Menu</button>
      <nav id="nav-menu" class="hidden w-full md:block md:w-auto">
        <div class="mt-3 flex flex-col gap-1 md:mt-0 md:flex-row md:items-center md:gap-1">
          <a data-nav="home" href="index.html" class="nav-link rounded-lg px-3 py-2 text-sm text-stone-600 hover:bg-emerald-50">Home</a>
          <a data-nav="disease" href="disease.html" class="nav-link rounded-lg px-3 py-2 text-sm text-stone-600 hover:bg-emerald-50">Disease Detection</a>
          <a data-nav="treatment" href="treatment.html" class="nav-link rounded-lg px-3 py-2 text-sm text-stone-600 hover:bg-emerald-50">Treatment</a>
          <a data-nav="weather" href="weather.html" class="nav-link rounded-lg px-3 py-2 text-sm text-stone-600 hover:bg-emerald-50">Weather</a>
          <a data-nav="mandi" href="mandi.html" class="nav-link rounded-lg px-3 py-2 text-sm text-stone-600 hover:bg-emerald-50">Mandi Prices</a>
          <a data-nav="chatbot" href="chatbot.html" class="nav-link rounded-lg px-3 py-2 text-sm text-stone-600 hover:bg-emerald-50">AI Assistant</a>
          <a data-nav="about" href="about.html" class="nav-link rounded-lg px-3 py-2 text-sm text-stone-600 hover:bg-emerald-50">About</a>
          <a href="disease.html" class="mt-2 rounded-full bg-emerald-700 px-4 py-2 text-center text-sm font-medium text-white md:ml-2 md:mt-0">Analyze Plant</a>
        </div>
      </nav>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-4 py-10">
    <h1 class="font-display text-3xl md:text-4xl">Live Mandi Prices</h1>
    <p class="mt-3 text-stone-600">Sourced directly from the data.gov.in API through the existing Python mandi module.</p>

    <form id="mandi-form" class="mt-8 grid gap-4 rounded-2xl border border-stone-200 bg-white p-5 shadow-sm md:grid-cols-3">
      <label class="text-sm font-medium">
        State
        <select id="state-select" class="mt-2 w-full rounded-xl border border-stone-300 bg-white px-4 py-3 text-sm outline-none ring-emerald-600 focus:ring-2">
          <option>Maharashtra</option>
          <option>Uttar Pradesh</option>
          <option>Punjab</option>
          <option>Gujarat</option>
          <option>Karnataka</option>
        </select>
      </label>
      <label class="text-sm font-medium">
        Crop
        <select id="crop-select" class="mt-2 w-full rounded-xl border border-stone-300 bg-white px-4 py-3 text-sm outline-none ring-emerald-600 focus:ring-2">
          <option>Tomato</option>
          <option>Potato</option>
          <option>Onion</option>
          <option>Wheat</option>
          <option>Apple</option>
          <option>Cotton</option>
        </select>
      </label>
      <div class="flex items-end">
        <button type="submit" class="w-full rounded-full bg-emerald-700 px-5 py-3 text-sm font-semibold text-white hover:bg-emerald-800">Fetch Latest Prices</button>
      </div>
    </form>

    <p id="error-box" class="mt-4 hidden rounded-xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-800"></p>
    <p id="empty-box" class="mt-4 hidden rounded-xl border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-900"></p>
    <p id="mandi-loading" class="mt-6 hidden text-sm font-medium text-emerald-800">Connecting to market data...</p>

    <section id="mandi-result" class="mt-8 hidden rounded-2xl border border-stone-200 bg-white p-5 shadow-sm">
      <h2 id="mandi-title" class="text-lg font-semibold"></h2>
      <div class="table-wrap mt-4">
        <table class="w-full text-left">
          <thead id="mandi-head" class="bg-stone-50"></thead>
          <tbody id="mandi-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/mandi.js"></script>
</body>
</html>
